<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuaPurge Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #e2e8f0;
        }
        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }
        .input-area {
            background-color: #0a0a0a;
            border: 1px solid #1a1a1a;
        }
        .input-area:focus-within {
            border-color: #334155;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 10px;
        }
        /* Toggle Styling */
        .dot {
            transition: all 0.2s ease-in-out;
        }
        input:checked ~ .dot {
            transform: translateX(100%);
            background-color: #6366f1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-10">

    <div class="w-full max-w-6xl">
        <!-- Header & Mode Selection -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-6">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">LuaPurge <span class="text-indigo-500">Pro</span></h1>
                <p class="text-xs text-zinc-500 uppercase tracking-widest mt-1">Roblox Script Optimizer</p>
            </div>

            <div class="flex items-center gap-4 bg-zinc-900/50 p-2 rounded-lg border border-zinc-800">
                <span class="text-xs font-medium text-zinc-400 ml-2">Notes Only</span>
                <label for="modeToggle" class="flex items-center cursor-pointer">
                    <div class="relative">
                        <input type="checkbox" id="modeToggle" class="sr-only">
                        <div class="block bg-zinc-800 w-10 h-5 rounded-full"></div>
                        <div class="dot absolute left-1 top-1 bg-zinc-500 w-3 h-3 rounded-full transition"></div>
                    </div>
                </label>
                <span class="text-xs font-medium text-zinc-400 mr-2">Notes + Prints</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <!-- Left: Input -->
            <div class="flex flex-col">
                <div class="flex justify-between items-center mb-2 px-1">
                    <label class="text-xs font-semibold text-zinc-500 uppercase">Input Script</label>
                    <button onclick="clearAll()" class="text-[10px] text-zinc-600 hover:text-zinc-300 uppercase transition">Clear</button>
                </div>
                <textarea 
                    id="codeInput" 
                    placeholder="Paste Roblox code here..."
                    class="w-full h-[400px] md:h-[550px] p-5 input-area rounded-xl outline-none resize-none code-font text-sm custom-scrollbar"
                ></textarea>
                <button 
                    onclick="process()" 
                    class="mt-4 w-full py-4 bg-white text-black font-bold rounded-lg hover:bg-zinc-200 transition-all active:scale-[0.98]"
                >
                    Process Script
                </button>
            </div>

            <!-- Right: Output -->
            <div class="flex flex-col">
                <div class="flex justify-between items-center mb-2 px-1">
                    <label class="text-xs font-semibold text-zinc-500 uppercase">Cleaned Output</label>
                    <span id="copyMsg" class="text-[10px] text-indigo-400 opacity-0 transition-opacity">Copied!</span>
                </div>
                <div class="relative flex-grow">
                    <pre 
                        id="codeOutput" 
                        class="w-full h-[400px] md:h-[550px] p-5 input-area rounded-xl code-font text-sm overflow-auto custom-scrollbar whitespace-pre text-zinc-400"
                    >Waiting for input...</pre>
                    
                    <button 
                        onclick="copyOutput()" 
                        class="absolute bottom-4 right-4 px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-xs font-bold rounded-md border border-zinc-700 transition"
                    >
                        Copy Result
                    </button>
                </div>
                <div class="mt-4 p-4 rounded-lg border border-zinc-900 text-[11px] text-zinc-600 italic">
                    All original indentation and spacing is preserved for readability.
                </div>
            </div>
        </div>
    </div>

    <script>
        function process() {
            const input = document.getElementById('codeInput').value;
            const output = document.getElementById('codeOutput');
            const removePrints = document.getElementById('modeToggle').checked;

            if (!input.trim()) {
                output.innerText = "Please provide code...";
                return;
            }

            let result = input;

            // 1. Remove Multi-line comments --[[ ]]
            result = result.replace(/--\[\[[\s\S]*?\]\]/g, '');

            // 2. Remove Single-line comments --
            result = result.replace(/--.*$/gm, '');

            // 3. Optional: Remove Prints
            if (removePrints) {
                // Matches print(...) even if it spans multiple lines, or simple single line prints
                // This regex looks for print followed by balanced parentheses
                result = result.replace(/print\s*\([\s\S]*?\)/g, '');
            }

            // Clean up trailing whitespace per line
            result = result.split('\n').map(line => line.trimEnd()).join('\n');

            output.innerText = result;
            output.classList.remove('text-zinc-600');
            output.classList.add('text-indigo-100');
        }

        function copyOutput() {
            const text = document.getElementById('codeOutput').innerText;
            if (text === "Waiting for input..." || text === "Please provide code...") return;

            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            const msg = document.getElementById('copyMsg');
            msg.style.opacity = '1';
            setTimeout(() => msg.style.opacity = '0', 2000);
        }

        function clearAll() {
            document.getElementById('codeInput').value = '';
            document.getElementById('codeOutput').innerText = 'Waiting for input...';
            document.getElementById('codeOutput').classList.add('text-zinc-600');
        }
    </script>
</body>
</html>
